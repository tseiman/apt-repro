name: Publish APT repository

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Distributions to receive the release packages
        required: true
        type: choice
        options:
          - bookworm
          - trixie
          - both

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install reprepro
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg

      - name: Download release packages and verify checksums
        env:
          RELEASE_URL: https://github.com/tseiman/HomeAutomationMonitorGW/releases/download/v1.1.5
        shell: bash
        run: |
          mkdir -p incoming
          cd incoming

          for package in automation-gateway automation-gateway-led; do
            for architecture in amd64 arm64; do
              asset="${package}_1.1.5_${architecture}.deb"
              curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output "$asset" -- "$RELEASE_URL/$asset"
              curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output "$asset.sha256" -- "$RELEASE_URL/$asset.sha256"
              expected="$(awk 'NR == 1 { sub(/\r$/, ""); print $1 }' "$asset.sha256")"
              if [[ ! "$expected" =~ ^[[:xdigit:]]{64}$ ]]; then
                echo "Invalid SHA256 checksum in $asset.sha256" >&2
                exit 1
              fi
              printf '%s  %s\n' "${expected,,}" "$asset" | sha256sum --check
            done
          done

      - name: Build and sign APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          DISTRIBUTION: ${{ inputs.distribution }}
        shell: bash
        run: |
          : "${APT_GPG_PRIVATE_KEY:?Missing repository secret APT_GPG_PRIVATE_KEY}"
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          trap 'gpgconf --kill gpg-agent; rm -r -- "$GNUPGHOME"' EXIT
          umask 077
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          if [[ -n "$APT_GPG_PASSPHRASE" ]]; then
            printf '%s\n' "$APT_GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
            printf '%s\n' batch 'pinentry-mode loopback' "passphrase-file $GNUPGHOME/passphrase" > "$GNUPGHOME/gpg.conf"
          fi
          unset APT_GPG_PRIVATE_KEY APT_GPG_PASSPHRASE
          umask 022

          case "$DISTRIBUTION" in
            bookworm|trixie) distributions=("$DISTRIBUTION") ;;
            both) distributions=(bookworm trixie) ;;
            *) exit 1 ;;
          esac

          for distribution in "${distributions[@]}"; do
            for package_file in incoming/*.deb; do
              reprepro --export=never includedeb "$distribution" "$package_file"
            done
          done
          reprepro export

          gpg --batch --yes --dearmor --output "$GNUPGHOME/apt-repo.gpg" apt-repo.asc
          mapfile -t configured_distributions < <(awk '$1 == "Codename:" { print $2 }' conf/distributions)
          for distribution in "${configured_distributions[@]}"; do
            gpgv --keyring "$GNUPGHOME/apt-repo.gpg" "dists/$distribution/InRelease"
          done

          mkdir -p site
          cp -R dists pool site/
          cp apt-repo.asc site/

      - name: Test repository with APT
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
        shell: bash
        run: |
          archive="$PWD/site"
          for release in "$archive"/dists/*/Release; do
            distribution="$(basename "$(dirname "$release")")"
            components="$(sed -n 's/^Components: //p' "$release")"
            read -ra architectures <<< "$(sed -n 's/^Architectures: //p' "$release")"
            apt_dir="$(mktemp -d)"
            printf 'deb [signed-by=%s/apt-repo.asc] file:%s %s %s\n' "$archive" "$archive" "$distribution" "$components" > "$apt_dir/repository.list"
            apt_options=(
              -o "Dir::Etc::sourcelist=$apt_dir/repository.list"
              -o "Dir::Etc::sourceparts=-"
              -o "Dir::State::lists=$apt_dir/lists"
              -o "APT::Sandbox::User=$(id -un)"
            )
            for architecture in "${architectures[@]}"; do
              apt_options+=(-o "APT::Architectures::=$architecture")
            done
            mkdir -p "$apt_dir/lists/partial"
            apt-get "${apt_options[@]}" --error-on=any update

            if [[ "$DISTRIBUTION" == "$distribution" || ( "$DISTRIBUTION" == both && "$distribution" =~ ^(bookworm|trixie)$ ) ]]; then
              for package_file in "$PWD"/incoming/*.deb; do
                package="$(dpkg-deb -f "$package_file" Package)"
                version="$(dpkg-deb -f "$package_file" Version)"
                architecture="$(dpkg-deb -f "$package_file" Architecture)"
                download_dir="$(mktemp -d "$apt_dir/download.XXXXXX")"
                (cd "$download_dir" && apt-get "${apt_options[@]}" download "$package:$architecture=$version")
                cmp "$package_file" "$download_dir"/*.deb
              done
            fi
            rm -r -- "$apt_dir"
          done

      - name: Generate directory listings
        run: |
          python3 - <<'PY'
          from html import escape
          from pathlib import Path
          from urllib.parse import quote

          root = Path("site")
          directories = [root, *(path for path in root.rglob("*") if path.is_dir())]
          for directory in directories:
              title = f"APT repository / {directory.relative_to(root).as_posix()}" if directory != root else "APT repository"
              links = ['<li><a href="../">Parent directory</a></li>'] if directory != root else []
              for entry in sorted(directory.iterdir(), key=lambda path: (not path.is_dir(), path.name)):
                  if entry.name == "index.html":
                      continue
                  suffix = "/" if entry.is_dir() else ""
                  href = quote(entry.name) + suffix
                  label = escape(entry.name) + suffix
                  links.append(f'<li><a href="{href}">{label}</a></li>')
              (directory / "index.html").write_text(
                  '<!doctype html><html lang="en"><meta charset="utf-8">'
                  f'<title>{escape(title)}</title><h1>{escape(title)}</h1>'
                  f'<ul>{"".join(links)}</ul></html>',
                  encoding="utf-8",
              )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
